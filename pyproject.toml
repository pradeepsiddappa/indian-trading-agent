[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-trading-agent"
version = "0.1.0"
description = "Indian Market Trading Agent: AI-powered short-term trading decisions for NSE/BSE"
readme = "README.md"
requires-python = ">=3.11.5"
dependencies = [
    "langchain-core>=1.4.6",
    "langchain-anthropic>=1.4.6",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=1.1.14",
    "langgraph>=0.4.8",
    "pandas>=2.3.0",
    "parsel>=1.10.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "rank-bm25>=0.2.2",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=84.1.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "yfinance>=0.2.63",
    "python-dotenv>=1.0.0",
    # Backend (FastAPI app in backend/)
    "fastapi>=0.135.0",
    "uvicorn>=0.44.0",
    "websockets>=16.0",
    "feedparser>=6.0.12",
    "numpy>=2.0",
    "nsepython>=2.97",
]

[project.optional-dependencies]
# Zerodha Kite holdings sync: pip install -e ".[kite]"
# Optional (and not in requirements.txt) because kiteconnect pins
# autobahn==19.11.2, which has open advisories (CVE-2020-35678,
# CVE-2026-77528). Only kiteconnect's live-feed client uses autobahn, and the
# app never opens that feed.
kite = ["kiteconnect>=5.2.2"]

[project.scripts]
indian-trading-agent = "cli.main:app"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*"]

[tool.setuptools.package-data]
cli = ["static/*"]
